# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: francesc.mateu@mongodb.com

env:
  NODE_ENV: production
  APP_ENV: production
  # AWS region for IRSA (no credentials needed)
  AWS_REGION: us-east-1
  # The frontend is the public Kanopy container and should listen on 8080.
  PORT: "8080"
  # The Next.js proxy forwards browser requests to this backend service.
  CLINICAL_TRIAL_MATCHING_AGENT_BACKEND_URL: http://<service-name>:80

## Single Pod Containers
envSecrets:
  # MongoDB Configuration
  MONGODB_URI: clinical-trial-matching-agent-production
  DATABASE_NAME: clinical-trial-matching-agent-production
  CLINICAL_TRIALS_MONGODB_URI: clinical-trial-matching-agent-production
  CLINICAL_TRIALS_DATABASE_NAME: clinical-trial-matching-agent-production
  LEAFY_HOSPITAL_MONGODB_URI: clinical-trial-matching-agent-production
  LEAFY_HOSPITAL_DATABASE_NAME: clinical-trial-matching-agent-production
  VOYAGE_API_KEY: clinical-trial-matching-agent-production
  # Bedrock Inference Profiles (see cloud-cost-tracking.md)
  CHATCOMPLETIONS_MODEL_ID: clinical-trial-matching-agent-production
  EMBEDDINGS_MODEL_ID: clinical-trial-matching-agent-production

